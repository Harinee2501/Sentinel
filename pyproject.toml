[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
version = "0.1.0"
description = "A framework-agnostic runtime guardrail engine for agentic AI systems, with Python middleware and MCP proxy adaptors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
keywords = ["ai-agents", "agent-security", "guardrails", "mcp", "llm", "prompt-injection"]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "sentence-transformers>=2.7",
    "numpy>=1.26",
    "sqlmodel>=0.0.16",
    "streamlit>=1.35",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
]

# Registers the `agent-sentinel` command once the package is installed
# (e.g. `agent-sentinel mcp-proxy --config config/default_policy.yaml`)
[project.scripts]
agent-sentinel = "agent_sentinel.cli:app"

[tool.setuptools.packages.find]
include = ["agent_sentinel*"]
